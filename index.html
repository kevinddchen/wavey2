<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monterey Bay Dive Conditions</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preload" href="data/waves.bin.gz" as="fetch" crossorigin="anonymous" />
    <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script defer src="js/version.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="map-panel">
        <div id="map"></div>
        <div id="time-control">
          <button id="play-btn" title="Play/Pause">&#9654;</button>
          <input type="range" id="time-slider" min="0" value="0" step="1" />
          <div id="time-right">
            <span id="time-label"></span>
            <div id="legend">
              <canvas id="legend-canvas" width="180" height="14"></canvas>
              <div class="legend-labels"><span>0 ft</span><span>6 ft</span><span>12+ ft</span></div>
              <span class="legend-title">Significant Wave Height</span>
            </div>
          </div>
        </div>
      </div>

      <div id="resizer"></div>

      <div id="sidebar">
        <div id="info-panel">
          <h1>Monterey Bay Dive Conditions</h1>
          <p id="status"></p>
          <div id="selected-info">
            <span id="selected-coords"></span>
          </div>
          <p id="instructions">
            <span class="dot primary">&#9679;</span> Left-click: primary &middot;
            <span class="dot comparison">&#9679;</span> Right-click: comparison
          </p>
        </div>

        <div id="charts-panel">
          <div class="chart-container" id="dive-sites">
            <select id="dive-sites-select" class="primary">
              <option value="" disabled selected>Primary site&hellip;</option>
            </select>
            <select id="dive-sites-select-2" class="comparison">
              <option value="" disabled selected>Comparison site&hellip;</option>
              <option value="clear">(clear comparison)</option>
            </select>
          </div>
          <div class="chart-container">
            <h3>Significant Wave Height</h3>
            <canvas id="chart-height"></canvas>
          </div>
          <div class="chart-container">
            <h3>Peak Wave Period</h3>
            <canvas id="chart-period"></canvas>
          </div>
          <div class="chart-container">
            <h3>Peak Wave Direction</h3>
            <canvas id="chart-dir"></canvas>
          </div>
          <div class="chart-container">
            <h3>Sea Surface Level (relative to MSL)</h3>
            <canvas id="chart-tide"></canvas>
          </div>
          <a id="github-link" href="https://github.com/kevinddchen/wavey2" target="_blank" rel="noopener"
            >View on GitHub · <span id="version-label"></span
          ></a>
        </div>
      </div>
    </div>
  </body>
</html>
