name: Deploy to GitHub Pages

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_NO_DEV: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch latest tag
        id: latest_tag
        run: |
          git fetch --tags
          tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "Latest tag: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Checkout latest tag
        run: |
          git checkout ${{ steps.latest_tag.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group archive

      - name: Build site
        run: |
          bash fetch.sh
          mkdir _site
          cp index.html favicon.svg _site/
          cp -r css js data _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Configure AWS credentials
        if: vars.AWS_ARCHIVE_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARCHIVE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ARCHIVE_REGION }}

      - name: Archive GRIB2 files to S3
        if: vars.AWS_ARCHIVE_BUCKET != ''
        run: |
          uv run -m wavey2.apps.sync_gribs --grib-dir gribs --bucket "${{ vars.AWS_ARCHIVE_BUCKET }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
