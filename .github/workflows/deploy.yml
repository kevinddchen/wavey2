name: Deploy to GitHub Pages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.download.outputs.changed }}

    permissions:
      contents: read
      pages: read
      id-token: write

    env:
      UV_NO_DEV: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch latest tag
        id: latest_tag
        run: |
          git fetch --tags
          tag=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          echo "Latest tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout latest tag
        env:
          TAG: ${{ steps.latest_tag.outputs.tag }}
        run: |
          git checkout "$TAG"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group archive

      # Most of the runs NOAA serves were already downloaded by the previous build, so fetching from cache.
      # `key` is required but nothing can match it here, so this always falls through to the newest entry.
      - name: Restore GRIB2 cache
        uses: actions/cache/restore@v6
        with:
          path: gribs
          key: gribs-
          restore-keys: gribs-

      # Every later step, and the deploy job, is skipped unless this downloaded a new run. A manual run
      # always builds, since that is how a newly pushed tag gets deployed.
      - name: Download GRIB2 files
        id: download
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p gribs
          before=$(ls gribs)
          bash scripts/fetch.sh
          after=$(ls gribs)
          if [[ "$FORCE" == "true" || "$before" != "$after" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new forecasts; skipping build and deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.download.outputs.changed == 'true'
        run: |
          bash scripts/build.sh
          mkdir _site
          cp index.html favicon.svg _site/
          cp -r css js data _site/

      - name: Setup Pages
        if: steps.download.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.download.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Save GRIB2 cache
        if: steps.download.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: gribs
          key: gribs-${{ hashFiles('gribs/**') }}

      - name: Configure AWS credentials
        if: steps.download.outputs.changed == 'true' && vars.AWS_ARCHIVE_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARCHIVE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ARCHIVE_REGION }}

      - name: Archive GRIB2 files to S3
        if: steps.download.outputs.changed == 'true' && vars.AWS_ARCHIVE_BUCKET != ''
        env:
          BUCKET: ${{ vars.AWS_ARCHIVE_BUCKET }}
        run: |
          uv run -m wavey2.apps.sync_gribs --grib-dir gribs --bucket "$BUCKET"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.changed == 'true'

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
