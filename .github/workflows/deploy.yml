name: Deploy to GitHub Pages

on:
    schedule:
        - cron: "0 7,13 * * *"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            UV_NO_DEV: "1"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v8.1.0
              with:
                  version: "0.11.8"
                  python-version: "3.14"
                  enable-cache: true

            - name: Install dependencies
              run: |
                  uv sync

            - name: Build site
              run: |
                  uv run scripts/download_latest_grib.py --path latest.grib2
                  uv run python scripts/grib2json.py latest.grib2
                  mkdir _site
                  cp index.html _site/
                  cp -r css js data _site/

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: _site/

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
