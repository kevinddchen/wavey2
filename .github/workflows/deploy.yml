name: Deploy to GitHub Pages

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_NO_DEV: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch latest tag
        id: latest_tag
        run: |
          git fetch --tags
          tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "Latest tag: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Checkout latest tag
        run: |
          git checkout ${{ steps.latest_tag.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.8"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync

      - name: Build site
        run: |
          mkdir -p gribs data
          uv run scripts/download_grib.py --all --out-dir gribs
          for f in gribs/*.grib2; do
            uv run scripts/grib2bin.py "$f" --out-dir data || echo "WARNING: failed to convert $f"
          done
          uv run scripts/build_index.py --dir data
          uv run scripts/download_buoy.py --buoy-id 46236 --out-dir data || echo "WARNING: buoy 46236 fetch failed"
          uv run scripts/download_buoy.py --buoy-id 46239 --out-dir data || echo "WARNING: buoy 46239 fetch failed"
          mkdir _site
          cp index.html favicon.svg _site/
          cp -r css js data _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
