[project]
name = "wavey2"
dynamic = ["version"] # Read from `js/version.js`; see `[tool.hatch.version]`
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "numpy",
    "pygrib",
    "requests",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]",
    "mypy",
    "ruff",
    "types-requests",
]
archive = [
    "boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "js/version.js"
pattern = '^const VERSION = "(?P<version>.+?)";'

[tool.hatch.build.targets.wheel]
packages = ["py/wavey2"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = [
    "pygrib",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
