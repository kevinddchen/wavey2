[project]
name = "wavey2"
dynamic = ["version"] # Read from `js/version.js`; see `[tool.hatch.version]`
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "numpy",
    "pydantic",
    "pygrib",
    "requests",
    "tyro",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]",
    "ruff",
    "ty",
    "types-requests",
]
archive = [
    "boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "js/version.js"
pattern = '^const VERSION = "(?P<version>.+?)";'

[tool.hatch.build.targets.wheel]
packages = ["py/wavey2"]

[tool.ty.environment]
python-version = "3.14"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
